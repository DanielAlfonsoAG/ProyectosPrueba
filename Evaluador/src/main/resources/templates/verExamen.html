<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <!--    <th:block th:replace="links/linksCss :: linksCss"></th:block>-->
    <!--    <th:block th:replace="links/linksJs :: linksJs"></th:block>-->
    <!-- loader-->
    <link th:href="@{/css/principal_css/pace.min.css}" rel="stylesheet"/>
    <script th:src="@{/css/js/pace.min.js}"></script>
    <!--favicon-->
    <link rel="icon" th:href="@{/css/images/favicon.ico}" type="image/x-icon">
    <!-- simplebar CSS-->
    <link th:href="@{/css/plugins/simplebar/css/simplebar.css}" rel="stylesheet"/>
    <!-- Bootstrap core CSS-->
    <link th:href="@{/css/principal_css/bootstrap.min.css}" rel="stylesheet"/>
    <!-- animate CSS-->
    <link th:href="@{/css/principal_css/animate.css}" rel="stylesheet" type="text/css"/>
    <!-- Icons CSS-->
    <link th:href="@{/css/principal_css/icons.css}" rel="stylesheet" type="text/css"/>
    <!-- Sidebar CSS-->
    <link th:href="@{/css/principal_css/sidebar-menu.css}" rel="stylesheet"/>
    <!-- Custom Style-->
    <link th:href="@{/css/principal_css/app-style.css}" rel="stylesheet"/>
    <title>Evaluador</title>
</head>
<body class="bg-theme bg-theme1">
<div id="wrapper">
    <!--Start sidebar-wrapper-->
    <div th:replace="sidebar/vertical :: barraCompleta"></div>
    <!--End sidebar-wrapper-->

    <!--Start topbar header-->
    <div th:replace="sidebar/horizontal :: barraCompleta"></div>
    <!--End topbar header-->

    <div class="clearfix"></div>

    <div class="content-wrapper">
        <div class="container-fluid">
            <div class="row mt-3">
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Lista de Exámenes</h5>
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">Título</th>
                                        <th scope="col">Dificultad</th>
                                        <th scope="col">Creador</th>
                                        <th scope="col">Acciones</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tbody>
                                    <tr th:each="examen : ${examenes}">
                                        <td th:text="${examen.id_examen}"></td>
                                        <td th:text="${examen.titulo}"></td>
                                        <td th:text="${examen.dificultad}"></td>
                                        <td th:text="${examen.creadoPor.nombreUsuario}"></td>
                                        <td>
                                            <form th:action="@{'/eliminarExamen/' + ${examen.id_examen}}" method="post"
                                                  onsubmit="return confirm('¿Eliminar este examen?');">
                                                <button type="submit" class="btn btn-danger btn-sm">
                                                    <i class="fas fa-trash-alt"></i> Eliminar
                                                </button>
                                            </form>
                                            <form th:action="@{/editarExamen}" method="get" style="display: inline-block">
                                                <input type="hidden" name="id_examen" th:value="${examen.id_examen}" />
                                                <button type="submit" class="btn btn-outline-info btn-block">
                                                    <i class="fas fa-edit"></i> Editar
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div><!--End Row-->
            <!--start overlay-->
            <div class="overlay toggle-menu"></div>
            <!--end overlay-->
        </div>
        <!-- End container-fluid-->
    </div>
    <div th:replace="sidebar/theme :: theme"></div>
</div>
<!-- Bootstrap core JavaScript-->
<script th:src="@{/css/js/jquery.min.js}"></script>
<script th:src="@{/css/js/popper.min.js}"></script>
<script th:src="@{/css/js/bootstrap.min.js}"></script>

<!-- simplebar js -->
<script th:src="@{/css/plugins/simplebar/js/simplebar.js}"></script>
<!-- sidebar-menu js -->
<script th:src="@{/css/js/sidebar-menu.js}"></script>
<!-- Custom scripts -->
<script th:src="@{/css/js/app-script.js}"></script>
<!-- Chart js -->
<script th:src="@{/css/plugins/Chart.js/Chart.min.js}"></script>

<!-- Index js -->
<script th:src="@{/css/js/index.js}"></script>
</body>
</html>
